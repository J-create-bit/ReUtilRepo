<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Reútil</title>
</head>
<style>
body {font-family: Helvetica, sans-serif;}
* {box-sizing: border-box}

/* Full-width input fields */
input[type=text], input[type=password] {
  width: 100%;
  padding: 15px;
  margin: 5px 0 22px 0;
  display: inline-block;
  border: none;
  background: #f1f1f1;
}

input[type=text]:focus, input[type=password]:focus {
  background-color: #ddd;
  outline: none;
}

hr {
  border: 1px solid #f1f1f1;
  margin-bottom: 25px;
}

/* Set a style for all buttons */
button {
  background-color: #04AA6D;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
  opacity: 0.9;
}

button:hover {
  opacity:1;
}

/* Extra styles for the cancel button */
.cancelbtn {
  padding: 14px 20px;
  background-color: #f44336;
}

/* Float cancel and signup buttons and add an equal width */
.cancelbtn, .signupbtn {
  float: left;
  width: 50%;
}

/* Add padding to container elements */
.container {
  padding: 16px;
}

/* Clear floats */
.clearfix::after {
  content: "";
  clear: both;
  display: table;
}

/* Change styles for cancel button and signup button on extra small screens */
@media screen and (max-width: 300px) {
  .cancelbtn, .signupbtn {
     width: 100%;
  }
}
</style>
<body>

<form onsubmit="handleRegister(event)">
                    <div class="field">
                        <label>Nombre completo *</label>
                        <input type="text" name="nombre" required placeholder="José María González"/>
                    </div>
                    <div class="field">
                        <label>Email *</label>
                        <input type="email" name="email" required placeholder="mail@maturana.edu.uy"/>
                        <small>Solo se aceptan emails @maturana.edu.uy</small>
                    </div>
                    <div class="field">
                        <label>Contraseña *</label>
                        <input type="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres"/>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label>WhatsApp *</label>
                            <input type="tel" name="telefono" required placeholder="+598 99 123 456"/>
                        </div>
                        <div class="field">
                            <label>Zona/Barrio *</label>
                            <input type="text" name="zona" required placeholder="Ej: Nueva Savona"/>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="registerBtn">Crear cuenta</button>
                </form>

</body>
<script type="module" src="../public/registro.js"></script>
</html>
