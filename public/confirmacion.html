<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <title>Verificación | ReÚtil</title>
</head>
<body>
    <main class="verificacion-main">
        <section class="verificacion-card card-escalonada">

            <div class="verificacion-icono">✉</div>

            <h1>Verificación de cuenta</h1>

            <p>
Ingresa a tu e-mail y completa la verificación
            de tu cuenta para comenzar.
            </p>

            <div class="verificacion-aviso">
                <span>
                    Si no encontrás el correo, revisá también
                    el spam o correo no deseado.
                </span>
            </div>

            <a href="/" class="btn-plano verificacion-boton">
                Volver al inicio
            </a>
        </section>
    </main>
</body>
</html>
